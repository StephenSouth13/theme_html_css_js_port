<section class="contact-form-wrap">
        <h2>Yêu cầu tư vấn</h2>
        <form class="contact-form">
          <div class="form-row">
            <input type="text" placeholder="Họ và Tên (*)" required>
            <input type="tel" placeholder="Số điện thoại (*)" required>
          </div>
          <div class="form-row">
            <input type="email" placeholder="Địa chỉ email (*)" required>
            <input type="text" placeholder="Tên doanh nghiệp">
          </div>
          <textarea rows="5" placeholder="Nội dung cần tư vấn..."></textarea>
          <div class="checks">
            <label><input type="checkbox"> Thiết kế logo</label>
            <label><input type="checkbox"> Bộ Office</label>
            <label><input type="checkbox"> Website giới thiệu doanh nghiệp</label>
            <label><input type="checkbox"> Tạo kênh truyền thông (Facebook, Instagram, Youtube)</label>
            <label><input type="checkbox"> Email doanh nghiệp</label>
            <label><input type="checkbox"> Check in Facebook</label>
            <label><input type="checkbox"> Check in Google</label>
            <label><input type="checkbox"> Video giới thiệu</label>
            <label><input type="checkbox"> Bộ nhận diện thương hiệu</label>
            <label><input type="checkbox"> Bảo hộ Logo</label>
          </div>
          <div class="fake-captcha">
            <span></span>
            <strong>I'm not a robot</strong>
            <i data-lucide="refresh-cw"></i>
          </div>
          <button class="submit-btn" type="submit">Gửi yêu cầu</button>
        </form>
      </section>
