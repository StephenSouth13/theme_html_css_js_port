<section class="project-banner" aria-labelledby="projectSearchTitle">
    <div class="project-banner-overlay"></div>
    <div class="container">
        <form class="project-search-panel" action="#" method="get">
            <div class="project-search-top">
                <h1 id="projectSearchTitle">Tìm Dự Án</h1>
                <div class="project-search-input">
                    <label class="visually-hidden" for="projectName">Nhập tên dự án</label>
                    <input id="projectName" type="search" name="projectName" placeholder="Nhập tên dự án...">
                    <button class="project-search-icon" type="submit" aria-label="Tìm kiếm nhanh">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
                <button class="btn btn-primary-custom btn-small project-search-submit" type="submit">Tìm Kiếm</button>
            </div>

            <div class="project-filter-grid">
                <label class="project-filter-option">
                    <input type="radio" name="category" checked>
                    <span>Tất cả Dự án</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="category">
                    <span>BĐS Đô Thị</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="category">
                    <span>BĐS Nghỉ Dưỡng</span>
                </label>

                <label class="project-filter-option">
                    <input type="radio" name="area" checked>
                    <span>Các khu vực</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="area">
                    <span>Miền Bắc</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="area">
                    <span>Hồ Chí Minh</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="area">
                    <span>Bình Dương</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="area">
                    <span>Hồ Tràm - Vũng Tàu</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="area">
                    <span>Đà Nẵng - Huế</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="area">
                    <span>Đồng Nai - Đà Lạt</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="area">
                    <span>Long An</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="area">
                    <span>Nghệ An</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="area">
                    <span>Nha Trang</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="area">
                    <span>Phú Quốc</span>
                </label>

                <label class="project-filter-option">
                    <input type="radio" name="status" checked>
                    <span>Tình trạng xây dựng</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="status">
                    <span>Đang xây dựng</span>
                </label>
                <label class="project-filter-option">
                    <input type="radio" name="status">
                    <span>Đã hoàn thiện</span>
                </label>
            </div>
        </form>
    </div>
</section>
