<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tin tức bất động sản mới nhất từ Smartland">
    <title>Tin tức - Smartland</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <!-- Shared Header -->
    <div data-component="header" data-src="../../shared/header.html"></div>

    <main class="news-page-main">
        <!-- Hero Carousel Slider -->
        <div data-component="tin-tuc-hero" data-src="./components/hero.html"></div>

        <!-- Breadcrumb -->
        <div data-component="tin-tuc-breadcrumb" data-src="./components/featured-news.html"></div>

        <!-- News Content: List + Sidebar -->
        <section class="latest-news-section" id="latestNews">
            <div class="container news-page-container">
                <div class="row g-5">
                    <!-- News List -->
                    <div data-component="tin-tuc-news-list" data-src="./components/news-list.html"></div>

                    <!-- Sidebar -->
                    <div data-component="tin-tuc-sidebar" data-src="./components/sidebar.html"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Shared Footer -->
    <div data-component="footer" data-src="../../shared/footer.html"></div>

    <!-- Back To Top -->
    <div data-component="backtotop" data-src="../../shared/backtotop.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.ROOT_PATH = '../../';</script>
    <script src="../../js/script.js"></script>
</body>
</html>
