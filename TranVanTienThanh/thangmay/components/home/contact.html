<section class="section contact" id="contact">
  <div class="container contact__inner">
    <div>
      <span class="eyebrow">Liên hệ</span>
      <h2>Nhận tư vấn và báo giá thang máy</h2>
      <p>Đội ngũ kỹ thuật Phương Đông hỗ trợ khảo sát, chọn tải trọng, kích thước cabin và phương án thi công phù hợp công trình.</p>
    </div>
    <form class="contact-form">
      <input type="text" name="name" placeholder="Họ và tên" required>
      <input type="tel" name="phone" placeholder="Số điện thoại" required>
      <select name="type" required>
        <option value="">Nhu cầu tư vấn</option>
        <option>Thang máy gia đình</option>
        <option>Thang máy lồng kính</option>
        <option>Thang máy tải khách</option>
        <option>Bảo trì / sửa chữa</option>
      </select>
      <button class="btn btn--red btn--large" type="submit">Gửi yêu cầu</button>
    </form>
  </div>
</section>
